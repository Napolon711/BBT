name: ROS 2 Jazzy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep python3-yaml
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro jazzy
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y

      - name: Build all three packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select rm2027_interfaces ros2_libxr bbt_decide \
            --event-handlers console_direct+

      - name: Compile Python tools
        run: python3 -m compileall -q tools src/ros2_libxr/scripts

      - name: Run existing tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select bbt_decide ros2_libxr \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros-jazzy-test-results
          path: |
            build/*/Testing/
            build/*/test_results/
            log/
          if-no-files-found: warn
          retention-days: 14
