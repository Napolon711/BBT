# BBT 使用 27BT-UC 的裁判场地系和红方基准点表，单位 m。
# 开局必须人工传 own_team:=red/blue；蓝方绕场心旋转180度，ID和region语义不变。
# 裁判机器人ID不用于选择/核实开局阵营；额外UC输入话题不影响BBT。
# 当前暂用裁判地图（map=field，恒等变换）；以后保留 align_map.py 做实测标定。
# field_to_map: p_map = R(dyaw_deg) * p_field + [dx,dy]。
# 点表保留UC的39个ID与坐标；defend/harass/hole在BBT中归入patrol。
# 洞流程：入口停车折叠 -> Nav2一次提交[中心途经点,出口目标] -> 出口停车展开。
# 中心是途经点，不是独立目标；不得在中心报到达停车。
enable_tunnel: true
regions:
- own_low
- own_high
- mid
- enemy_low
- enemy_high
# Region cells use the Arena rmuc2027 source terrain polygons (rules.json),
# converted once into referee field coordinates: [x, 15-y]. mid includes
# central_* and both road/access surfaces; *_high is the corresponding
# trapezoid plus slopes. Remaining ground is split at x=14 into *_low.
# These are routing regions, not an elevation classifier. Multiple simple
# cells may share a name; a boundary shared by distinct regions is unknown.
