# BBT 点表按我方/敌方语义使用；点 ID、坐标及 region 保留原人工配置。
# 不根据红蓝阵营镜像、旋转、换点或增加启动门控。
# field_to_map: p_map = R(dyaw_deg) * p_field + [dx,dy]。
# 当前直接使用裁判场地坐标：map=field，已确认恒等变换；另建导航地图时再标定。
# 操作手点击必须与点表采用同一场地坐标系，不能混用旧 STL 与裁判坐标。
# 前哨几何坐标和战术点来自 27BT-UC；地图见 docs/referee_map_20261031.png。可关闭 outpost.enable。
# hp_amount=1 表示一次远程回血请求，恢复量由裁判规则决定。
